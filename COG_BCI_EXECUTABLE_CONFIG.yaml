# COG-BCI One-Shot Prospective Executable Config
# =============================================================================
# Frozen BEFORE any COG-BCI predictive metric is computed. No AUC, model score,
# separability statistic, permutation statistic, feature importance, or any
# outcome-dependent result was computed in producing this file.
#
# STATUS (top-level gate):
status: BLOCKED_PROTOCOL_AMBIGUITY_DO_NOT_RUN
# This config is NOT cleared for the single prospective run. A material conflict
# exists between two committed, pre-data freezes about the sampling rate of the
# already-frozen MAT transport pipeline (see `sampling_pipeline` below and
# `COG_BCI_EXECUTABLE_FREEZE_DECISION.md`). Per the executable-freeze task's
# Critical Pipeline-Lock Issue, any such conflict must be reported as a protocol
# ambiguity and the one-shot test must NOT run until the ambiguity is resolved by
# an explicit, documented protocol amendment (not a silent post-metadata choice).

frozen_before_any_cog_bci_predictive_metric: true
freeze_date: "2026-06-04"
branch: claude/cog-bci-executable-freeze

dataset:
  name: COG-BCI (Hinss et al. 2023)
  zenodo_record: "7413650"
  concept_doi: "10.5281/zenodo.6874128"
  license: CC-BY-4.0
  role: single_untouched_prospective_evaluation_dataset
  development_only_evidence: [MAT, STEW]   # never count as prospective validation

# -----------------------------------------------------------------------------
# Exact subjects (all 29 unless a pre-outcome objective failure excludes one)
# -----------------------------------------------------------------------------
subjects:
  included:
    - sub-01
    - sub-02
    - sub-03
    - sub-04
    - sub-05
    - sub-06
    - sub-07
    - sub-08
    - sub-09
    - sub-10
    - sub-11
    - sub-12
    - sub-13
    - sub-14
    - sub-15
    - sub-16
    - sub-17
    - sub-18
    - sub-19
    - sub-20
    - sub-21
    - sub-22
    - sub-23
    - sub-24
    - sub-25
    - sub-26
    - sub-27
    - sub-28
    - sub-29
  n_included: 29
  exclusions: []
  exclusion_rule_pre_outcome_only:
    - unreadable_locked_input
    - missing_locked_channel
    - missing_locked_condition
    - corrupt_signal
    - non_finite_source_data
  note: >
    No outcome-dependent exclusion is permitted. Subject cherry-picking after any
    metric is accessed is prohibited.

# -----------------------------------------------------------------------------
# Exact session / condition filenames (one session, predeclared)
# -----------------------------------------------------------------------------
session:
  primary_session: ses-S1
  selection_rule: first_chronologically_labeled_session_non_performance
  secondary_sessions_in_primary_run: false   # ses-S2/ses-S3 NOT used in primary
conditions:
  calibration:
    role: calibration_unlabeled_baseline
    recording: RS_Beg_EO
    files: [RS_Beg_EO.set, RS_Beg_EO.fdt]
    eyes_state: eyes_open   # eyes-closed RS_Beg_EC excluded
  scored_rest:
    role: scored_rest_label_0
    recording: RS_End_EO
    files: [RS_End_EO.set, RS_End_EO.fdt]
    eyes_state: eyes_open   # eyes-closed RS_End_Ec excluded
  scored_task:
    role: scored_task_label_1
    recording: MATBdiff
    files: [MATBdiff.set, MATBdiff.fdt]
    paradigm: MATB
    level: difficult
    selection_rule: highest_documented_workload_level_predeclared_by_construct
  nback_in_primary_run: false   # N-back cannot influence the primary verdict

# -----------------------------------------------------------------------------
# Exact channel mapping (8 locked harmonized channels)
# -----------------------------------------------------------------------------
channels:
  locked_count: 8
  cog_bci_names: [F3, F4, F7, F8, O1, O2, T7, T8]
  mat_names:     [F3, F4, F7, F8, O1, O2, T3, T4]
  mapping_cog_to_mat:
    F3: F3
    F4: F4
    F7: F7
    F8: F8
    O1: O1
    O2: O2
    T7: T3
    T8: T4
  on_missing_locked_channel: stop_before_modeling_report_incompatibility_no_substitution

# -----------------------------------------------------------------------------
# Exact sampling / resampling rule  <-- THE BLOCKING AMBIGUITY
# -----------------------------------------------------------------------------
sampling_pipeline:
  resolved: false
  blocking: true
  cog_bci_native_hz: 500
  conflict_summary: >
    The z-scoring transport hypothesis and its trained MAT model were generated by
    the frozen MAT->STEW transport pipeline, which extracted the 96 features from
    MAT AFTER resampling MAT 500 Hz -> 128 Hz
    (results/stew_sensitivity/transport_compatible_feature_spec.yaml:
    mat_resample: {method: scipy.signal.resample_poly, up: 32, down: 125,
    native_hz: 500, target_hz: 128.0}). The 96 transport features are
    scale/offset-invariant (x->a*x+b) but they are NOT sampling-rate-invariant:
    band_rel_{delta,theta,alpha,beta}, spectral_entropy, hjorth_mobility,
    hjorth_complexity, and the band ratios all change with sampling rate.
  committed_documents_in_conflict:
    frozen_transport_spec_says_128hz:
      file: results/stew_sensitivity/transport_compatible_feature_spec.yaml
      claim: MAT resampled 500->128 Hz; the 96 features (and the trained model) are 128 Hz
    cog_bci_protocol_says_500hz_native:
      file: COG_BCI_ONE_SHOT_PROSPECTIVE_TEST_PROTOCOL.md
      claim: >
        "the already-frozen MAT transport-compatible source pipeline (... 500 Hz
        native - no resample needed since COG-BCI is also 500 Hz)"
      also_repeated_in:
        - COG_BCI_SOURCE_PROVENANCE_AUDIT.md  # "500 Hz matches MAT (no MAT resample needed)"
        - COG_BCI_SOURCE_PROVENANCE_DECISION.md
  conservative_no_drift_default_recommended_but_NOT_adopted_unilaterally:
    rule: resample_cog_bci_500_to_128_hz_then_extract_the_same_96_features
    method: scipy.signal.resample_poly
    up: 32
    down: 125
    target_hz: 128.0
    rationale: >
      Matches the exact rate at which the trained MAT model and the 96 features
      were frozen, so no silent feature-distribution drift is introduced. This is
      the most conservative no-drift implementation. It is NOT adopted here because
      adopting it unilaterally would override the committed COG-BCI protocol's
      explicit "500 Hz native, no resample" statement, which would itself be a
      post-metadata protocol change. Resolution requires an explicit documented
      amendment reconciling the two committed freezes.
  why_native_500_is_unsafe: >
    Applying the 128-Hz-trained MAT model to COG-BCI features extracted at native
    500 Hz (or silently re-fitting a new native-500-Hz MAT model) is a different
    pipeline than the one that generated the hypothesis, producing systematically
    shifted band-power / spectral-entropy / Hjorth distributions = silent drift.

# -----------------------------------------------------------------------------
# Exact feature set (frozen 96 transport-compatible)
# -----------------------------------------------------------------------------
features:
  spec_file: results/stew_sensitivity/transport_compatible_feature_spec.yaml
  feature_set: transport_invariant_96
  n_features: 96
  templates_per_channel:
    - stat_skew
    - stat_kurtosis
    - hjorth_mobility
    - hjorth_complexity
    - spectral_entropy
    - band_rel_delta
    - band_rel_theta
    - band_rel_alpha
    - band_rel_beta
    - ratio_theta_alpha
    - ratio_beta_alpha
    - ratio_theta_beta
  reselection_allowed: false

# -----------------------------------------------------------------------------
# Exact baseline calibration method definitions (per subject, unlabeled baseline)
# -----------------------------------------------------------------------------
calibration_methods:
  primary: zscore                 # center by baseline mean, scale by baseline std
  primary_comparator: mean_subtraction   # baseline centering only
  secondary_comparator: absolute  # no per-subject calibration
  calibration_source: calibration_unlabeled_baseline_RS_Beg_EO_first_30s
  label_discipline: >
    COG-BCI workload labels are NEVER used for training, preprocessing fitting,
    feature selection, calibration-method selection, or tuning. Calibration stats
    come only from the unlabeled eyes-open RS_Beg_EO baseline.

# -----------------------------------------------------------------------------
# Exact segmentation / window rule (sampling-rate-independent; defined in seconds)
# -----------------------------------------------------------------------------
segmentation:
  calibration_segment: first_30s_of_RS_Beg_EO
  scored_rest_segment: first_30s_of_RS_End_EO
  scored_task_segment: first_30s_of_MATBdiff
  segment_seconds: 30.0
  window_seconds: 4.0
  overlap_fraction: 0.5
  step_seconds: 2.0
  windows_per_30s_segment: 14
  equal_scored_rest_and_task_windows_per_subject: 14
  equalization_rule: min(scored_rest_windows, scored_task_windows)
  window_plan_file: results/cog_bci_provenance/cog_bci_primary_session_window_plan.csv
  note: window counts are time-defined and identical (14/14/14) for all 29 subjects regardless of sampling rate.

# -----------------------------------------------------------------------------
# Exact model hyperparameters (fixed L2 logistic; no tuning)
# -----------------------------------------------------------------------------
model:
  name: logistic_l2
  C: 1.0
  solver: liblinear
  class_weight: balanced
  max_iter: 5000
  fit_on: MAT_training_only   # imputer + scaler + model fit on MAT only
  tuning_allowed: false

# -----------------------------------------------------------------------------
# Exact endpoint / comparison / success rules
# -----------------------------------------------------------------------------
endpoint:
  primary_metric: macro_subject_level_ROC_AUC
  primary_superiority_comparison: paired_subject_bootstrap_delta_AUC_zscore_minus_mean_subtraction
  bootstrap_resamples: 2000
  secondary_comparison: paired_subject_bootstrap_delta_AUC_zscore_minus_absolute
  also_report:
    - per_method_macro_subject_mean_median_AUC
    - subject_SD
    - subject_bootstrap_95CI
    - full_pipeline_macro_subject_permutation_test_min_200_for_zscore
decision_rules:
  full_success: zscore_above_chance AND paired_95CI(zscore - mean_subtraction) excludes_zero_positive
  partial: zscore_above_chance AND paired_95CI(zscore - mean_subtraction) includes_zero
  failure: zscore_at_or_below_chance OR zscore_does_not_outperform_mean_subtraction
  single_execution_only: true
  post_outcome_changes_allowed: false   # no retune/task-switch/channel-expand/feature-reselect/endpoint-change/subject-cherry-pick

# -----------------------------------------------------------------------------
# Source input integrity
# -----------------------------------------------------------------------------
source_inputs:
  raw_dir: data/raw/cog_bci/zenodo_6874128   # git-ignored; never committed
  input_hash_manifest: results/cog_bci_provenance/cog_bci_execution_input_hash_manifest.csv
  locally_materialized_subjects: [sub-01, sub-02, sub-03, sub-04, sub-05, sub-06, sub-07, sub-08, sub-09, sub-10]
  locally_materialized_count: 10
  local_exact_input_files_hashed: 60   # 10 subjects x 3 conditions x 2 files, SHA-256
  remote_not_yet_materialized_subjects_count: 19   # sub-11 .. sub-29 (full download deferred)
  hash_method_local: sha256_exact_input_files_plus_zip_md5_verified
  full_materialization_complete: false
  full_materialization_gate: >
    Full local download + MD5 verification of all 29 subjects is deliberately
    deferred while status == BLOCKED_PROTOCOL_AMBIGUITY_DO_NOT_RUN. Downloading the
    remaining ~19 GB is not warranted for a test that cannot validly run as
    currently specified. It must complete (all 29 local + verified, no live remote
    range reads) BEFORE any eventual single run, once the ambiguity is resolved.

# -----------------------------------------------------------------------------
# Exact future run-once output paths
# -----------------------------------------------------------------------------
run_once_outputs:
  results_dir: results/cog_bci_one_shot
  primary_results: results/cog_bci_one_shot/cog_bci_primary_results.json
  per_subject_auc: results/cog_bci_one_shot/cog_bci_per_subject_auc.csv
  bootstrap_ci: results/cog_bci_one_shot/cog_bci_paired_bootstrap_ci.json
  permutation: results/cog_bci_one_shot/cog_bci_permutation.json
  run_marker: results/cog_bci_one_shot/RUN_MARKER.json
  config_checksum_record: results/cog_bci_one_shot/config_and_script_checksums.json
  abort_if_any_exist: true   # prevents a second result-producing execution
